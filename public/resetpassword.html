<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Redefinir Senha | Transcreve AI</title>
  <!-- Google Fonts + Font Awesome -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="icon" href="assets/robo.ico" type="image/x-icon">
  <style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Inter', sans-serif;
        background: #ffffff;
        color: #1a1a2e;
        line-height: 1.5;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
    }

    /* Gradiente de fundo */
    .bg-gradient {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at 0% 0%, #f8f5ff, #ffffff);
        z-index: -2;
    }

    /* Container principal */
    .reset-container {
        max-width: 480px;
        width: 90%;
        margin: 2rem auto;
        padding: 2rem;
        background: white;
        border-radius: 32px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.15);
        border: 1px solid #eeeef5;
        transition: all 0.3s ease;
    }

    /* Logo */
    .logo {
        text-align: center;
        margin-bottom: 2rem;
    }

    .logo a {
        font-size: 2rem;
        font-weight: 800;
        letter-spacing: -0.5px;
        background: linear-gradient(135deg, #5B3B8C, #EAB308);
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        text-decoration: none;
    }

    /* Header */
    .reset-header {
        text-align: center;
        margin-bottom: 2rem;
    }

    .reset-header h1 {
        font-size: 1.75rem;
        font-weight: 700;
        margin-bottom: 0.5rem;
        color: #1a1a2e;
    }

    .reset-header p {
        color: #6a6a8a;
        font-size: 0.9rem;
    }

    /* Badge amarelo */
    .badge {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: #FEF9C3;
        border-radius: 100px;
        padding: 0.3rem 1rem;
        font-size: 0.7rem;
        font-weight: 600;
        color: #854D0E;
        margin-bottom: 1rem;
    }

    /* Formulário */
    .reset-form {
        margin: 1.5rem 0;
    }

    .input-group {
        margin-bottom: 1.5rem;
    }

    .input-group label {
        display: block;
        font-size: 0.85rem;
        font-weight: 600;
        margin-bottom: 0.5rem;
        color: #4a4a6a;
    }

    .input-wrapper {
        position: relative;
        display: flex;
        align-items: center;
    }

    .input-wrapper i {
        position: absolute;
        left: 1rem;
        color: #aaaac0;
        font-size: 1rem;
    }

    .input-wrapper input {
        width: 100%;
        padding: 0.9rem 1rem 0.9rem 2.8rem;
        border: 1.5px solid #e0e0e6;
        border-radius: 16px;
        font-size: 0.95rem;
        font-family: 'Inter', sans-serif;
        transition: all 0.2s ease;
        background: white;
    }

    .input-wrapper input:focus {
        outline: none;
        border-color: #5B3B8C;
        box-shadow: 0 0 0 3px rgba(91, 59, 140, 0.1);
    }

    .input-wrapper input.error {
        border-color: #e53e3e;
    }

    .toggle-password {
        position: absolute;
        right: 1rem;
        left: auto;
        cursor: pointer;
        color: #aaaac0;
        transition: color 0.2s;
    }

    .toggle-password:hover {
        color: #5B3B8C;
    }

    /* Validação de senha */
    .password-strength {
        margin-top: 0.5rem;
    }

    .strength-bars {
        display: flex;
        gap: 6px;
        margin-bottom: 0.5rem;
    }

    .strength-bar {
        flex: 1;
        height: 4px;
        background: #e0e0e6;
        border-radius: 4px;
        transition: all 0.2s;
    }

    .strength-bar.active {
        background: #e53e3e;
    }

    .strength-bar.active.weak {
        background: #e53e3e;
    }

    .strength-bar.active.medium {
        background: #EAB308;
    }

    .strength-bar.active.strong {
        background: #10b981;
    }

    .strength-text {
        font-size: 0.7rem;
        color: #8a8aa0;
    }

    /* Requisitos de senha */
    .password-requirements {
        margin-top: 0.75rem;
        background: #fafaff;
        border-radius: 12px;
        padding: 0.75rem;
        border: 1px solid #eeeef5;
    }

    .requirement {
        font-size: 0.7rem;
        color: #8a8aa0;
        margin: 0.25rem 0;
        display: flex;
        align-items: center;
        gap: 6px;
    }

    .requirement i {
        font-size: 0.65rem;
        width: 16px;
    }

    .requirement.valid {
        color: #10b981;
    }

    .requirement.invalid {
        color: #8a8aa0;
    }

    /* Mensagem de erro */
    .error-message {
        background: #FEF2F2;
        border-left: 3px solid #e53e3e;
        padding: 0.75rem 1rem;
        border-radius: 12px;
        margin-bottom: 1.5rem;
        font-size: 0.8rem;
        color: #C53030;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    .success-message {
        background: #F0FDF4;
        border-left: 3px solid #10b981;
        padding: 0.75rem 1rem;
        border-radius: 12px;
        margin-bottom: 1.5rem;
        font-size: 0.8rem;
        color: #065F46;
        display: flex;
        align-items: center;
        gap: 8px;
    }

    /* Botões */
    .btn-reset {
        width: 100%;
        background: #5B3B8C;
        border: none;
        padding: 1rem;
        border-radius: 16px;
        font-weight: 700;
        font-size: 1rem;
        color: white;
        cursor: pointer;
        transition: all 0.2s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 0.5rem;
    }

    .btn-reset:hover {
        background: #7C4A9E;
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(91, 59, 140, 0.25);
    }

    .btn-reset:disabled {
        opacity: 0.6;
        cursor: not-allowed;
        transform: none;
    }

    /* Links */
    .back-link {
        text-align: center;
        margin-top: 1.5rem;
    }

    .back-link a {
        color: #5B3B8C;
        text-decoration: none;
        font-size: 0.85rem;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        transition: color 0.2s;
    }

    .back-link a:hover {
        color: #EAB308;
    }

    /* Divider */
    .divider {
        display: flex;
        align-items: center;
        gap: 1rem;
        margin: 1.5rem 0;
        color: #d0d0dd;
        font-size: 0.75rem;
    }

    .divider-line {
        flex: 1;
        height: 1px;
        background: #e0e0e6;
    }

    /* Estado de carregamento */
    .spinner {
        width: 18px;
        height: 18px;
        border: 2px solid rgba(255,255,255,0.3);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        display: inline-block;
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }

    /* Responsividade */
    @media (max-width: 480px) {
        .reset-container {
            padding: 1.5rem;
            margin: 1rem auto;
        }
        .reset-header h1 {
            font-size: 1.5rem;
        }
    }

    /* Animações fade */
    .fade-up {
        opacity: 0;
        transform: translateY(20px);
        animation: fadeUp 0.5s ease forwards;
    }

    @keyframes fadeUp {
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
  </style>
</head>
<body>
<div class="bg-gradient"></div>

<div class="reset-container fade-up">
  <!-- Logo -->
  <div class="logo">
    <a href="#">Transcreve<span style="background: linear-gradient(135deg, #EAB308, #5B3B8C); background-clip: text; -webkit-background-clip: text; color: transparent;">AI</span></a>
  </div>

  <!-- Header -->
  <div class="reset-header">
    <div class="badge">
      <i class="fas fa-lock"></i> Segurança em primeiro lugar
    </div>
    <h1>Criar nova senha</h1>
    <p>Digite sua nova senha abaixo para redefinir seu acesso à conta</p>
  </div>

  <!-- Container de mensagens -->
  <div id="messageContainer"></div>

  <!-- Formulário -->
  <form id="resetPasswordForm" class="reset-form">
    <!-- Nova senha -->
    <div class="input-group">
      <label for="newPassword">Nova senha</label>
      <div class="input-wrapper">
        <i class="fas fa-key"></i>
        <input type="password" id="newPassword" placeholder="Digite sua nova senha" autocomplete="new-password">
        <i class="fas fa-eye toggle-password" data-target="newPassword" style="right: 1rem; left: auto; cursor: pointer;"></i>
      </div>
      <!-- Força da senha -->
      <div class="password-strength" id="strengthContainer">
        <div class="strength-bars">
          <div class="strength-bar" id="bar1"></div>
          <div class="strength-bar" id="bar2"></div>
          <div class="strength-bar" id="bar3"></div>
        </div>
        <div class="strength-text" id="strengthText">Digite uma senha forte</div>
      </div>
      <!-- Requisitos -->
      <div class="password-requirements" id="requirements">
        <div class="requirement" id="reqLength">
          <i class="fas fa-circle"></i> <span>Mínimo 8 caracteres</span>
        </div>
        <div class="requirement" id="reqUpper">
          <i class="fas fa-circle"></i> <span>Letra maiúscula (A-Z)</span>
        </div>
        <div class="requirement" id="reqNumber">
          <i class="fas fa-circle"></i> <span>Número (0-9)</span>
        </div>
        <div class="requirement" id="reqSpecial">
          <i class="fas fa-circle"></i> <span>Caractere especial (!@#$%&*)</span>
        </div>
      </div>
    </div>

    <!-- Confirmar senha -->
    <div class="input-group">
      <label for="confirmPassword">Confirmar nova senha</label>
      <div class="input-wrapper">
        <i class="fas fa-check-circle"></i>
        <input type="password" id="confirmPassword" placeholder="Confirme sua nova senha" autocomplete="off">
        <i class="fas fa-eye toggle-password" data-target="confirmPassword" style="right: 1rem; left: auto; cursor: pointer;"></i>
      </div>
    </div>

    <!-- Botão -->
    <button type="submit" class="btn-reset" id="submitBtn">
      <i class="fas fa-sync-alt"></i> Redefinir senha
    </button>
  </form>

  <div class="divider">
    <div class="divider-line"></div>
    <span>ou</span>
    <div class="divider-line"></div>
  </div>

  <div class="back-link">
    <a href="#" id="backToLogin">
      <i class="fas fa-arrow-left"></i> Voltar para o login
    </a>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js"></script>
<script src="assets/js/supabaseClient.js"></script>

<script>

  const form = document.getElementById('resetPasswordForm');
  const messageContainer = document.getElementById('messageContainer');
  const submitBtn = document.getElementById('submitBtn');

  const newPassword = document.getElementById('newPassword');
  const confirmPassword = document.getElementById('confirmPassword');

  // =========================
  // MENSAGEM
  // =========================
  function showMessage(text, type = "error") {
    messageContainer.innerHTML = `
      <div class="${type === "error" ? "error-message" : "success-message"}">
        <i class="fas ${type === "error" ? "fa-exclamation-circle" : "fa-check-circle"}"></i>
        ${text}
      </div>
    `;
  }

  // =========================
  // REGRAS DE SENHA
  // =========================
  function validatePassword(password) {
    return {
      length: password.length >= 8,
      upper: /[A-Z]/.test(password),
      number: /[0-9]/.test(password),
      special: /[!@#$%^&*(),.?":{}|<>]/.test(password)
    };
  }

  function isPasswordValid(password) {
    const r = validatePassword(password);
    return r.length && r.upper && r.number && r.special;
  }

  // =========================
  // FORÇA DA SENHA (BARRAS)
  // =========================
  const bar1 = document.getElementById('bar1');
  const bar2 = document.getElementById('bar2');
  const bar3 = document.getElementById('bar3');
  const strengthText = document.getElementById('strengthText');

  function checkStrength(password) {
    const r = validatePassword(password);
    const score = Object.values(r).filter(Boolean).length;

    [bar1, bar2, bar3].forEach(b => b.className = "strength-bar");

    if (score === 0) {
      strengthText.innerText = "Digite uma senha forte";
    }

    if (score >= 1) {
      bar1.classList.add("active", "weak");
      strengthText.innerText = "Senha fraca";
    }

    if (score >= 2) {
      bar2.classList.add("active", "medium");
      strengthText.innerText = "Senha média";
    }

    if (score >= 3) {
      bar3.classList.add("active", "strong");
      strengthText.innerText = "Senha forte";
    }
  }

  newPassword.addEventListener("input", () => {
    checkStrength(newPassword.value);

    // ativa/desativa botão
    submitBtn.disabled = !isPasswordValid(newPassword.value);
  });

  // =========================
  // TOGGLE SENHA
  // =========================
  document.querySelectorAll('.toggle-password').forEach(icon => {
    icon.addEventListener('click', () => {
      const targetId = icon.dataset.target;
      const input = document.getElementById(targetId);

      if (!input) return;

      if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.remove("fa-eye-slash");
        icon.classList.add("fa-eye");
      }
    });
  });

  // =========================
  // VALIDAR LINK DO RESET
  // =========================
  (async () => {
    const { data, error } = await window.supabaseClient.auth.getSession();

    if (error || !data.session) {
      showMessage("Link inválido ou expirado.");
      submitBtn.disabled = true;
    }
  })();

  // =========================
  // SUBMIT RESET PASSWORD
  // =========================
  form.addEventListener('submit', async (e) => {
    e.preventDefault();

    const password = newPassword.value.trim();
    const confirm = confirmPassword.value.trim();

    messageContainer.innerHTML = "";

    // valida regras
    const rules = validatePassword(password);

    if (!rules.length || !rules.upper || !rules.number || !rules.special) {
      return showMessage("Senha deve ter 8+ caracteres, 1 maiúscula, 1 número e 1 especial.");
    }

    if (password !== confirm) {
      return showMessage("As senhas não coincidem.");
    }

    submitBtn.disabled = true;
    submitBtn.innerHTML = `<span class="spinner"></span> Salvando...`;

    const { error } = await window.supabaseClient.auth.updateUser({
      password
    });

    if (error) {
      console.error(error);
      showMessage("Erro ao redefinir senha.");
      submitBtn.disabled = false;
      submitBtn.innerHTML = `<i class="fas fa-sync-alt"></i> Redefinir senha`;
      return;
    }

    showMessage("Senha alterada com sucesso!", "success");

    setTimeout(() => {
      window.location.href = "/login.html";
    }, 1500);
  });

  // =========================
  // VOLTAR LOGIN
  // =========================
  document.getElementById('backToLogin').addEventListener('click', (e) => {
    e.preventDefault();
    window.location.href = "/login.html";
  });
</script>
</body>
</html>
